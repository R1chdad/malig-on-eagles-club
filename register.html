<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join MALIG-ON Eagles Club</title><style>:root{--g:#d8b454;--i:#f3eedf;--m:#9f9a8d;--l:rgba(216,180,84,.2)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#12150e,#070806 42%,#050604);color:var(--i);font-family:Inter,Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,680px);border:1px solid var(--l);border-radius:22px;background:linear-gradient(145deg,#11130f,#090a08);padding:28px}.brand{text-align:center}.brand img{width:110px;height:110px;object-fit:contain}.brand h1{font:700 38px Georgia,serif;margin:8px 0}.brand p{color:var(--m);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:11px;color:#d2c7a8;margin:14px 0 7px}input,textarea{width:100%;border:1px solid #373124;background:#080907;color:white;border-radius:11px;padding:13px;outline:none}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}button{width:100%;margin-top:20px;border:0;border-radius:12px;padding:15px;background:linear-gradient(135deg,#efd175,#b78a2e);color:#171105;font-weight:900;cursor:pointer}.msg{min-height:22px;margin-top:14px;text-align:center;font-size:12px;color:#d8b454;line-height:1.5}.back{display:block;text-align:center;color:#aaa28f;margin-top:18px;text-decoration:none;font-size:12px}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:20px}.brand h1{font-size:31px}}</style></head><body><div class="wrap"><main class="card"><div class="brand"><img src="logo.svg" alt="MALIG-ON official crest"><h1>Membership Application</h1><p>Apply to join MALIG-ON Eagles Club. Your application will be reviewed by the chapter administration.</p></div><form id="form"><div class="grid"><div><label>Full Name</label><input id="name" required></div><div><label>Mobile Number</label><input id="mobile" type="tel" required></div><div class="full"><label>Address</label><textarea id="address" required></textarea></div><div><label>Email Address</label><input id="email" type="email" required></div><div><label>Create Password</label><input id="password" type="password" minlength="8" required></div><div class="full"><label>Profile Photo</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><button id="submit">SUBMIT APPLICATION</button><div id="msg" class="msg"></div></form><a class="back" href="/">Already have an account? Sign in</a></main></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://mwgzekyynlbttwqreepu.supabase.co','sb_publishable_LbeCaCu_Yvgp7PJ2fhIxEw_RJ96fIkq');const $=s=>document.querySelector(s),f=$('#form'),msg=$('#msg'),btn=$('#submit');f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Submitting application…';const email=$('#email').value.trim(),password=$('#password').value,name=$('#name').value.trim(),mobile=$('#mobile').value.trim(),address=$('#address').value.trim(),photo=$('#photo').files[0];try{if(!photo)throw new Error('Profile photo is required.');if(photo.size>5*1024*1024)throw new Error('Profile photo must be 5MB or smaller.');const{data,error}=await sb.auth.signUp({email,password,options:{data:{membership_application:'malig-on',full_name:name,mobile,address}}});if(error)throw error;if(!data.user)throw new Error('Unable to create account.');if(!data.session){msg.textContent='Application received and marked Pending Review. Please confirm your email. After confirmation, sign in to your member account to complete secure access.';f.reset();return}const ext=(photo.name.split('.').pop()||'jpg').toLowerCase(),path=`${data.user.id}/profile.${ext}`;const up=await sb.storage.from('member-photos').upload(path,photo,{upsert:true,contentType:photo.type});if(up.error)throw up.error;const upd=await sb.from('profiles').update({full_name:name,address,mobile,email,photo_path:path,updated_at:new Date().toISOString()}).eq('id',data.user.id);if(upd.error)throw upd.error;msg.textContent='Application submitted successfully. Status: Pending Review.';f.reset()}catch(err){msg.textContent=err.message||'Application could not be submitted.'}finally{btn.disabled=false}};</script></body></html>
