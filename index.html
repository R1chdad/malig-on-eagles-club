%,rgba(216,180,84,.22),transparent 26%),linear-gradient(120deg,#0b0d09,#12140d 48%,#090a08)}.hero-copy{position:relative;z-index:2;max-width:720px}.eyebrow{color:var(--g);font-size:10px;font-weight:800;letter-spacing:.2em}.hero h1{font:700 clamp(45px,6vw,75px)/.94 Georgia,serif;margin:13px 0 16px}.hero p{color:#c0baaa;line-height:1.65}.crest{position:absolute;right:7%;width:min(270px,24vw);object-fit:contain;filter:drop-shadow(0 25px 50px #000)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:15px}.stat,.card{border:1px solid var(--l);border-radius:14px;background:linear-gradient(145deg,#11130f,#090a08)}.stat{padding:18px}.stat small{font-size:9px;color:#8d887a;letter-spacing:.08em}.stat strong{display:block;font:700 34px Georgia,serif;margin:7px 0}.stat span{color:var(--g);font-size:10px}.section{margin-top:27px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.section-head h2{font:700 27px Georgia,serif;margin:0}.section-head span{font-size:11px;color:var(--m)}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.quick button{min-height:88px;text-align:left;border:1px solid var(--l);border-radius:13px;background:linear-gradient(145deg,#11130f,#0a0b09);color:var(--i);padding:16px;cursor:pointer}.quick b{display:block;margin-bottom:6px}.quick small{color:var(--m)}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.card{padding:20px}.card h2{font:700 25px Georgia,serif;margin:0 0 5px}.sub{color:var(--m);font-size:11px}.list{display:grid;gap:9px;margin-top:15px}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;border:1px solid rgba(216,180,84,.13);background:#090a08;border-radius:11px;padding:13px}.row-main{min-width:0}.row b{display:block}.row small{display:block;color:var(--m);margin-top:4px;line-height:1.4}.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.row-actions button{padding:7px 9px;font-size:9px}.empty members"><span>Members</span></button><button data-page="announcements"><span>Announcements</span></button><button data-page="projects"><span>Projects & Activities</span></button><button data-page="gallery"><span>Gallery</span></button></nav><nav id="memberNav" class="nav hidden"><button data-page="home" class="active"><span>Home</span></button><button data-page="memberAnnouncements"><span>Announcements</span></button><button data-page="memberProjects"><span>Projects & Activities</span></button><button data-page="memberGallery"><span>Gallery</span></button><button data-page="profile"><span>My Profile</span></button></nav><div class="quote">“Service Through<br>Strong Brotherhood.”</div></aside><main class="main"><header class="top"><div class="motto">BROTHERHOOD · SERVICE · LEADERSHIP</div><div class="account"><div id="desktopSwitch" class="switch hidden"><button id="adminBtn" class="active">ADMIN VIEW</button><button id="memberBtn">MEMBER VIEW</button></div><div class="avatar" id="avatar">M</div><div><b id="accountEmail">Account</b><small id="role">Member</small></div><button id="logout" class="ghost">Sign out</button></div></header><div id="content" class="content"></div></main></div><div id="mobileSwitch" class="mobile-switch hidden"><button id="mAdmin" class="active">ADMIN</button><button id="mMember">MEMBER</button></div><div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="x" id="closeModal">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://mwgzekyynlbttwqreepu.supabase.co','sb_publishable_LbeCaCu_Yvgp7PJ2fhIxEw_RJ96fIkq');const $=s=>document.querySelector(s),content=$('#content');let session=null,isAdmin=false,profile=null,view='member';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Date(d).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}):'—';function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}function empty(t,s){return `<div class="empty"><b>${t}</b>${s}</div>`}function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden')}$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden')};async function q(table,sel='*',opts={}){let x=sb.from(table).select(sel);if(opts.eq)for(const[k,v]of Object.entries(opts.eq))x=x.eq(k,v);if(opts.order)x=x.order(opts.order,{ascending:false});return x}async function counts(){const[p,m,a,pr]=await Promise.all([sb.from('profiles').select('*',{count:'exact',head:true}).eq('status','pending'),sb.from('profiles').select('*',{count:'exact',head:true}).eq('status','approved'),sb.from('announcements').select('*',{count:'exact',head:true}).eq('is_published',true),sb.from('projects').select('*',{count:'exact',head:true}).eq('is_published',true)]);return[p.count??0,m.count??0,a.count??0,pr.count??0]}function hero(admin=false){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${admin?'CHAPTER ADMINISTRATION':'WELCOME HOME KUYA!'}</div><h1>${admin?'Good evening,<br>Coach Jomz.':'MALIG-ON<br>Member Center'}</h1><p>${admin?'Manage membership, official communications, service projects, activities and chapter records from one command center.':'Your chapter in one place — official updates, service activities, brotherhood, and your membership record.'}</p></div><img class="crest" src="logo.svg" alt="MALIG-ON official crest"></section>`}async function dashboard(){const[p,m,a,pr]=await counts();content.innerHTML=hero(true)+`<section class="stats"><article class="stat"><small>PENDING APPLICATIONS</small><strong>${p}</strong><span>Review membership</span></article><article class="stat"><small>ACTIVE MEMBERS</small><strong>${m}</strong><span>Member records</span></article><article class="stat"><small>ANNOUNCEMENTS</small><strong>${a}</strong><span>Published updates</span></article><article class="stat"><small>PROJECTS & ACTIVITIES</small><strong>${pr}</strong><span>Published activity</span></article></section><section class="section"><div class="section-head"><h2>Quick Actions</h2><span>Chapter operations</span></div><div class="quick"><button data-go="applications"><b>Review Applications</b><small>Approve or reject membership</small></button><button data-new="announcement"><b>Add Announcement</b><small>Publish a chapter update</small></button><button data-new="project"><b>Create Project</b><small>Add service or activity</small></button><button data-new="gallery"><b>Upload to Gallery</b><small>Add chapter activity photos</small></button><button data-go="members"><b>Manage Members</b><small>Maintain member status</small></button></div></section><div class="grid2"><section class="section card"><h2>Recent Applications</h2><div id="dashApps"></div></section><section class="section card"><h2>Latest Announcements</h2><div id="dashNews"></div></section></div>`;bindActions();const{data:apps}=await sb.from('profiles').select('id,full_name,email,created_at').eq('status','pending').order('created_at',{ascending:false}).limit(5);$('#dashApps').innerHTML=apps?.length?`<div class="list">${apps.map(x=>`<div class="row"><div><b>${esc(x.full_name)}</b><small>${esc(x.email)} · ${fmt(x.created_at)}</small></div></div>`).join('')}</div>`:empty('No pending applications','New applications will appear here.');const{data:news}=await sb.from('announcements').select('title,created_at').order('created_at',{ascending:false}).limit(5);$('#dashNews').innerHTML=news?.length?`<div class="list">${news.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${fmt(x.created_at)}</small></div></div>`).join('')}</div>`:empty('No announcements yet','Published chapter updates will appear here.')}async function applications(){const{data,error}=await sb.from('profiles').select('*').eq('status','pending').order('created_at',{ascending:false});content.innerHTML=`<div class="section-head"><div><div class="eyebrow">MEMBERSHIP</div><h2>Member Applications</h2></div><span>${data?.length||0} pending</span></div><div class="card">${error?empty('Unable to load',esc(error.message)):data?.length?`<div class="list">${data.map(memberRow).join('')}</div>`:empty('No pending applications','Applications awaiting review will appear here.')}</div>`;bindMemberActions()}function memberRow(x){return `<div class="row"><div class="row-main"><b>${esc(x.full_name)}</b><small>${esc(x.email)} · ${esc(x.mobile)}<br>${esc(x.address)} · Applied ${fmt(x.created_at)}</small></div><div class="row-actions"><span class="badge">${esc(x.status)}</span>${x.status==='pending'?`<button class="primary" data-status="approved" data-id="${x.id}">Approve</button><button class="danger" data-status="rejected" data-id="${x.id}">Reject</button>`:`<button class="ghost" data-status="${x.status==='approved'?'inactive':'approved'}" data-id="${x.id}">${x.status==='approved'?'Set Inactive':'Activate'}</button>`}</div></div>`}async function members(){const{data,error}=await sb.from('profiles').select('*').neq('status','pending').order('created_at',{ascending:false});content.innerHTML=`<div class="section-head"><div><div class="eyebrow">CHAPTER DIRECTORY</div><h2>Members</h2></div><span>Approved, inactive and rejected records</span></div><div class="card">${error?empty('Unable to load',esc(error.message)):data?.length?`<div class="list">${data.map(memberRow).join('')}</div>`:empty('No member records yet','Approved members will appear here.')}</div>`;bindMemberActions()}function bindMemberActions(){document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{error}=await sb.from('profiles').update({status:b.dataset.status,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);if(error)toast(error.message);else{toast(`Member status: ${b.dataset.status}`);route(view==='admin'?(b.dataset.status==='approved'?'members':'applications'):'home')}})}async function announcements(memberMode=false){let x=sb.from('announcements').select('*').order('created_at',{ascending:false});if(memberMode)x=x.eq('is_published',true);const{data,error}=await x;content.innerHTML=`<div class="section-head"><div><div class="eyebrow">OFFICIAL COMMUNICATIONS</div><h2>Announcements</h2></div>${memberMode?'':`<button class="primary" data-new="announcement">+ New Announcement</button>`}</div><div class="card">${error?empty('Unable to load',esc(error.message)):data?.length?`<div class="list">${data.map(x=>`<div class="row"><div class="row-main"><b>${esc(x.title)}</b><small>${esc(x.body)}<br>${fmt(x.created_at)}</small></div><div class="row-actions"><span class="badge">${x.is_published?'Published':'Draft'}</span>${memberMode?'':`<button class="ghost" data-publish-ann="${x.id}" data-state="${!x.is_published}">${x.is_published?'Unpublish':'Publish'}</button><button class="danger" data-del-ann="${x.id}">Delete</button>`}</div></div>`).join('')}</div>`:empty('No announcements yet','Official chapter announcements will appear here.')}</div>`;bindActions();document.querySelectorAll('[data-publish-ann]').forEach(b=>b.onclick=async()=>{const state=b.dataset.state==='true';const{error}=await sb.from('announcements').update({is_published:state,published_at:state?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',b.dataset.publishAnn);error?toast(error.message):(toast('Announcement updated'),announcements())});document.querySelectorAll('[data-del-ann]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this announcement?'))return;const{error}=await sb.from('announcements').delete().eq('id',b.dataset.delAnn);error?toast(error.message):(toast('Announcement deleted'),announcements())})}async function projects(memberMode=false){let x=sb.from('projects').select('*').order('created_at',{ascending:false});if(memberMode)x=x.eq('is_published',true);const{data,error}=await x;content.innerHTML=`<div class="section-head"><div><div class="eyebrow">SERVICE & BROTHERHOOD</div><h2>Projects & Activities</h2></div>${memberMode?'':`<button class="primary" data-new="project">+ New Project</button>`}</div><div class="card">${error?empty('Unable to load',esc(error.message)):data?.length?`<div class="list">${data.map(x=>`<div class="row"><div class="row-main"><b>${esc(x.title)}</b><small>${esc(x.summary)}<br>${esc(x.status)} · ${fmt(x.event_date||x.created_at)}</small></div><div class="row-actions"><span class="badge">${x.is_published?'Published':'Draft'}</span>${memberMode?'':`<button class="ghost" data-publish-proj="${x.id}" data-state="${!x.is_published}">${x.is_published?'Unpublish':'Publish'}</button><button class="danger" data-del-proj="${x.id}">Delete</button>`}</div></div>`).join('')}</div>`:empty('No projects or activities yet','Chapter service initiatives will appear here.')}</div>`;bindActions();document.querySelectorAll('[data-publish-proj]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('projects').update({is_published:b.dataset.state==='true',updated_at:new Date().toISOString()}).eq('id',b.dataset.publishProj);error?toast(error.message):(toast('Project updated'),projects())});document.querySelectorAll('[data-del-proj]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this project?'))return;const{error}=await sb.from('projects').delete().eq('id',b.dataset.delProj);error?toast(error.message):(toast('Project deleted'),projects())})}async function gallery(memberMode=false){let x=sb.from('gallery_items').select('*').order('created_at',{ascending:false});if(memberMode)x=x.eq('is_published',true);const{data,error}=await x;const cards=(data||[]).map(x=>{const url=sb.storage.from('club-gallery').getPublicUrl(x.image_path).data.publicUrl;return `<article class="photo"><img src="${url}" alt="${esc(x.title)}"><div><b>${esc(x.title)}</b><small>${esc(x.caption||'')} ${x.activity_date?'· '+fmt(x.activity_date):''}</small>${memberMode?'':`<div class="row-actions" style="margin-top:9px"><button class="ghost" data-publish-gal="${x.id}" data-state="${!x.is_published}">${x.is_published?'Unpublish':'Publish'}</button><button class="danger" data-del-gal="${x.id}" data-path="${esc(x.image_path)}">Delete</button></div>`}</div></article>`}).join('');content.innerHTML=`<div class="section-head"><div><div class="eyebrow">CHAPTER MOMENTS</div><h2>Gallery</h2></div>${memberMode?'':`<button class="primary" data-new="gallery">+ Upload Photo</button>`}</div>${error?empty('Unable to load',esc(error.message)):cards?`<div class="gallery">${cards}</div>`:empty('Gallery is empty','Approved chapter activity photos will appear here.')}`;bindActions();document.querySelectorAll('[data-publish-gal]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('gallery_items').update({is_published:b.dataset.state==='true'}).eq('id',b.dataset.publishGal);error?toast(error.message):(toast('Gallery updated'),gallery())});document.querySelectorAll('[data-del-gal]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this gallery item?'))return;const del=await sb.from('gallery_items').delete().eq('id',b.dataset.delGal);if(del.error)return toast(del.error.message);await sb.storage.from('club-gallery').remove([b.dataset.path]);toast('Gallery item deleted');gallery()})}async function home(){const[{data:a},{data:p}]=await Promise.all([sb.from('announcements').select('*').eq('is_published',true).order('published_at',{ascending:false}).limit(3),sb.from('projects').select('*').eq('is_published',true).order('created_at',{ascending:false}).limit(3)]);content.innerHTML=hero(false)+`<div class="grid2 section"><article class="card"><h2>Chapter Updates</h2><div class="sub">Official announcements</div>${a?.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${esc(x.body)}</small></div></div>`).join('')}</div>`:empty('No published announcements yet','Official notices will appear here.')}</article><article class="card"><h2>My Membership</h2><div class="sub">Your chapter record and status</div><div class="metrics"><div class="metric"><b>${esc(profile?.status||'—')}</b><span>MEMBERSHIP</span></div><div class="metric"><b>${fmt(profile?.created_at)}</b><span>MEMBER SINCE</span></div><div class="metric"><b>${p?.length||0}</b><span>CURRENT ACTIVITIES</span></div></div></article></div><section class="section card"><h2>Projects & Activities</h2>${p?.length?`<div class="list">${p.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${esc(x.summary)} · ${fmt(x.event_date)}</small></div></div>`).join('')}</div>`:empty('No published activities yet','Approved chapter projects will appear here.')}</section>`}async function myProfile(){content.innerHTML=`<div class="section-head"><div><div class="eyebrow">MEMBERSHIP RECORD</div><h2>My Profile</h2></div></div><article class="card"><div class="form-grid"><div class="field"><label>FULL NAME</label><input id="pfName" value="${esc(profile?.full_name||'')}"></div><div class="field"><label>MOBILE</label><input id="pfMobile" value="${esc(profile?.mobile||'')}"></div><div class="field full"><label>ADDRESS</label><textarea id="pfAddress">${esc(profile?.address||'')}</textarea></div><div class="field"><label>EMAIL</label><input value="${esc(session.user.email||'')}" disabled></div><div class="field"><label>STATUS</label><input value="${esc(profile?.status||'Pending')}" disabled></div></div><div class="form-actions"><button id="saveProfile" class="primary">Save Profile</button></div><div id="profileMsg" class="msg"></div></article>`;$('#saveProfile').onclick=async()=>{const payload={full_name:$('#pfName').value.trim(),mobile:$('#pfMobile').value.trim(),address:$('#pfAddress').value.trim(),updated_at:new Date().toISOString()};const{error}=await sb.from('profiles').update(payload).eq('id',session.user.id);$('#profileMsg').textContent=error?error.message:'Profile updated.';if(!error){profile={...profile,...payload};toast('Profile updated')}}}function newAnnouncement(){modal('New Announcement',`<form id="annForm"><div class="field"><label>TITLE</label><input id="annTitle" required></div><div class="field"><label>MESSAGE</label><textarea id="annBody" required></textarea></div><div class="field"><label><input id="annPub" type="checkbox" style="width:auto"> Publish immediately</label></div><div class="form-actions"><button class="primary">Save Announcement</button></div><div id="formMsg" class="msg"></div></form>`);$('#annForm').onsubmit=async e=>{e.preventDefault();const pub=$('#annPub').checked;const{error}=await sb.from('announcements').insert({title:$('#annTitle').value.trim(),body:$('#annBody').value.trim(),is_published:pub,published_at:pub?new Date().toISOString():null,created_by:session.user.id});if(error)$('#formMsg').textContent=error.message;else{$('#modal').classList.add('hidden');toast('Announcement saved');route('announcements')}}}function newProject(){modal('New Project / Activity',`<form id="projForm"><div class="field"><label>TITLE</label><input id="projTitle" required></div><div class="field"><label>SUMMARY</label><textarea id="projSummary" required></textarea></div><div class="form-grid"><div class="field"><label>STATUS</label><select id="projStatus"><option value="planned">Planned</option><option value="ongoing">Ongoing</option><option value="completed">Completed</option></select></div><div class="field"><label>EVENT DATE</label><input id="projDate" type="date"></div></div><div class="field"><label><input id="projPub" type="checkbox" style="width:auto"> Publish immediately</label></div><div class="form-actions"><button class="primary">Save Project</button></div><div id="formMsg" class="msg"></div></form>`);$('#projForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('projects').insert({title:$('#projTitle').value.trim(),summary:$('#projSummary').value.trim(),status:$('#projStatus').value,event_date:$('#projDate').value||null,is_published:$('#projPub').checked,created_by:session.user.id});if(error)$('#formMsg').textContent=error.message;else{$('#modal').classList.add('hidden');toast('Project saved');route('projects')}}}function newGallery(){modal('Upload Gallery Photo',`<form id="galForm"><div class="field"><label>TITLE</label><input id="galTitle" required></div><div class="field"><label>CAPTION</label><textarea id="galCaption"></textarea></div><div class="form-grid"><div class="field"><label>ACTIVITY DATE</label><input id="galDate" type="date"></div><div class="field"><label>PHOTO</label><input id="galFile" type="file" accept="image/jpeg,image/png,image/webp" required></div></div><div class="field"><label><input id="galPub" type="checkbox" style="width:auto"> Publish immediately</label></div><div class="form-actions"><button class="primary">Upload Photo</button></div><div id="formMsg" class="msg"></div></form>`);$('#galForm').onsubmit=async e=>{e.preventDefault();const file=$('#galFile').files[0];if(!file)return;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${session.user.id}/${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('club-gallery').upload(path,file,{contentType:file.type});if(up.error)return $('#formMsg').textContent=up.error.message;const{error}=await sb.from('gallery_items').insert({title:$('#galTitle').value.trim(),caption:$('#galCaption').value.trim()||null,image_path:path,activity_date:$('#galDate').value||null,is_published:$('#galPub').checked,created_by:session.user.id});if(error){await sb.storage.from('club-gallery').remove([path]);return $('#formMsg').textContent=error.message}$('#modal').classList.add('hidden');toast('Photo uploaded');route('gallery')}}function bindActions(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>route(b.dataset.go));document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>({announcement:newAnnouncement,project:newProject,gallery:newGallery}[b.dataset.new]()))}async function route(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='dashboard')return dashboard();if(page==='applications')return applications();if(page==='members')return members();if(page==='announcements')return announcements();if(page==='projects')return projects();if(page==='gallery')return gallery();if(page==='home')return home();if(page==='memberAnnouncements')return announcements(true);if(page==='memberProjects')return projects(true);if(page==='memberGallery')return gallery(true);if(page==='profile')return myProfile()}function setView(v){view=v;const m=v==='member';$('#adminNav').classList.toggle('hidden',m);$('#memberNav').classList.toggle('hidden',!m);$('#adminBtn').classList.toggle('active',!m);$('#memberBtn').classList.toggle('active',m);$('#mAdmin').classList.toggle('active',!m);$('#mMember').classList.toggle('active',m);route(m?'home':'dashboard')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>route(b.dataset.page));$('#adminBtn').onclick=()=>setView('admin');$('#memberBtn').onclick=()=>setView('member');$('#mAdmin').onclick=()=>setView('admin');$('#mMember').onclick=()=>setView('member');$('#logout').onclick=async()=>{await sb.auth.signOut();boot()};$('#login').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginMsg').textContent=error?error.message:'';if(!error)boot()};async function boot(){const r=await sb.auth.getSession();session=r.data.session;if(!session){$('#gate').classList.remove('hidden');$('#app').classList.add('hidden');$('#mobileSwitch').classList.add('hidden');return}$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');$('#accountEmail').textContent=session.user.email||'Member';$('#avatar').textContent=(session.user.email?.[0]||'M').toUpperCase();const[{data:adminRow},{data:pf}]=await Promise.all([sb.from('admin_users').select('is_super_admin').eq('user_id',session.user.id).maybeSingle(),sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle()]);isAdmin=!!adminRow||session.user.email?.toLowerCase()==='coach.jomz@gmail.com';profile=pf;$('#role').textContent=isAdmin?'Super Administrator':'Member';$('#desktopSwitch').classList.toggle('hidden',!isAdmin);$('#mobileSwitch').classList.toggle('hidden',!isAdmin);setView(isAdmin?'admin':'member')}sb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();</script></body></html>
